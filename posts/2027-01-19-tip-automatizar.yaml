titulo: Si lo hacés a mano todos los días, se puede automatizar
texto: "Pasar datos de una planilla a otra, mandar el mismo mail, armar el mismo informe. Eso lo puede hacer un script mientras vos hacés otra cosa."
alt_text: "Placa de fondo oscuro con el título: si lo hacés a mano todos los días, se puede automatizar. Texto: pasar datos de una planilla a otra, mandar el mismo mail o armar el mismo informe lo puede hacer un script."
caption: |
  Pensá en la tarea que más repetís en la semana. Si siempre son los mismos pasos, probablemente se pueda automatizar.

  Contame cuál es por WhatsApp y te digo si tiene solución.
