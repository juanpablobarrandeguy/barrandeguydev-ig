titulo: Fijate si Google ve tu sitio
texto: "Buscá site:tunegocio.com en Google. Si no aparece nada, algo está impidiendo que te encuentren."
alt_text: "Placa de fondo oscuro con el título: fijate si Google ve tu sitio. Texto: buscá site: seguido de tu dominio en Google; si no aparece nada, algo está impidiendo que te encuentren."
caption: |
  Una prueba de diez segundos: escribí site: y tu dominio en Google, todo junto, por ejemplo site:tunegocio.com

  Si no aparece ninguna página, el sitio puede estar bloqueado para los buscadores. Pasa más de lo que parece, y se arregla.
