titulo: Activá la verificación en dos pasos
texto: "En el mail, en el banco y en las redes del negocio. Si alguien consigue tu clave, igual no puede entrar."
alt_text: "Placa de fondo oscuro con el título: activá la verificación en dos pasos. Texto: en el mail, en el banco y en las redes del negocio; si alguien consigue tu clave, igual no puede entrar."
caption: |
  Es lo que más protege por lo poco que cuesta: además de la clave, te pide un código en el celular.

  Empezá por el mail, que es desde donde se recupera todo lo demás.
