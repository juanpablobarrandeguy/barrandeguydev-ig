titulo: Revisá qué estás pagando en la nube
texto: "Servidores prendidos que nadie usa, discos viejos, copias duplicadas. Una revisión al año casi siempre encuentra algo para apagar."
alt_text: "Placa de fondo oscuro con el título: revisá qué estás pagando en la nube. Texto: servidores prendidos que nadie usa, discos viejos y copias duplicadas; una revisión al año casi siempre encuentra algo para apagar."
caption: |
  En la nube se paga por lo que está prendido, se use o no.

  Abrí la facturación y fijate qué servicios aparecen. Si hay algo que no sabés qué es, vale la pena preguntar antes de seguir pagándolo.
