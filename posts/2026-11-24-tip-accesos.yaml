titulo: Las claves de tu sitio, a tu nombre
texto: "Dominio, hosting y redes registrados con tu mail, no con el de quien te hizo el sitio. Si esa persona desaparece, no perdés el acceso."
alt_text: "Placa de fondo oscuro con el título: las claves de tu sitio, a tu nombre. Texto: dominio, hosting y redes registrados con tu mail y no con el de quien te hizo el sitio, para no perder el acceso."
caption: |
  Pasa seguido: el que armó el sitio registró todo con su cuenta, después no responde más y el negocio queda sin acceso a su propio dominio.

  Revisá con qué mail está registrado cada cosa. Si no es el tuyo, pedí que te lo pasen ahora, mientras hay buena relación.
