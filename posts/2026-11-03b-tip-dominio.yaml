titulo: Si se te vence el dominio, se cae todo
texto: "No solo el sitio: también el mail con tu dominio. Activá la renovación automática y fijate que la tarjeta cargada no esté vencida."
alt_text: "Placa de fondo oscuro con el título: si se te vence el dominio, se cae todo. Texto: no solo el sitio, también el mail con tu dominio; activá la renovación automática y revisá que la tarjeta cargada esté vigente."
caption: |
  El dominio es la dirección de tu sitio y de tu mail. Si no se renueva, dejan de andar los dos.

  Entrá hoy a donde lo registraste y revisá dos cosas: que la renovación automática esté activada y que la tarjeta no esté vencida.
