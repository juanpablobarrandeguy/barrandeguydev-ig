titulo: Un backup que nunca probaste no sirve
texto: "Cada tanto, recuperá un archivo o una base de prueba. Es la única forma de saber que el día que lo necesites va a andar."
alt_text: "Placa de fondo oscuro con el título: un backup que nunca probaste no sirve. Texto: cada tanto, recuperá un archivo o una base de prueba; es la única forma de saber que va a andar el día que lo necesites."
caption: |
  Tener backups no alcanza. Lo que importa es poder recuperarlos.

  Probá restaurar algo de vez en cuando: un archivo, una carpeta, una base de prueba. Si falla, mejor enterarte hoy y no el día que se te rompe el disco.
